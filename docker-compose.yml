services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: supermarket_db
    ports:
      - "3306:3306"
    volumes:
      - ./config/master/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - master_data:/var/lib/mysql
    networks:
      - dbms-net

  mysql-slave-1:
    image: mysql:8.0
    container_name: mysql-slave-1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - ./config/slave1/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - slave1_data:/var/lib/mysql
    depends_on:
      - mysql-master
    networks:
      - dbms-net

  mysql-slave-2:
    image: mysql:8.0
    container_name: mysql-slave-2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3308:3306"
    volumes:
      - ./config/slave2/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - slave2_data:/var/lib/mysql
    depends_on:
      - mysql-master
    networks:
      - dbms-net

networks:
  dbms-net:
    driver: bridge

volumes:
  master_data:
  slave1_data:
  slave2_data:
